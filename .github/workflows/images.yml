name: Build and publish container images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      packages: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oxygen-predictor-api:latest
            ghcr.io/${{ github.repository_owner }}/oxygen-predictor-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./Front_end
          file: ./Front_end/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oxygen-predictor-frontend:latest
            ghcr.io/${{ github.repository_owner }}/oxygen-predictor-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
