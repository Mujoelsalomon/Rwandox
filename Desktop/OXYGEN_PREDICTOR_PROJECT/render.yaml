services:
  - type: web
    name: rwandoxy-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /auth/me
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: rwandoxy.com,www.rwandoxy.com,rwandoxy-backend.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://rwandoxy.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://rwandoxy.com,https://www.rwandoxy.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://rwandoxy.com,https://www.rwandoxy.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"
      - key: DJANGO_USE_X_FORWARDED_PROTO
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: rwandoxy-postgres
          property: connectionString

  - type: web
    name: rwandoxy-frontend
    runtime: static
    rootDir: Front_end
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rwandoxy.com

databases:
  - name: rwandoxy-postgres
    plan: starter
