{% extends 'base.html' %} {% block title %}Patients{% endblock %} {% block
content %}
<div class="card">
  <h3>Patients</h3>
  <div style="margin-top: 12px">
    <table>
      <thead>
        <tr>
          <th>Hospital ID</th>
          <th>Age</th>
          <th>Sex</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody>
        {% for p in patients %}
        <tr>
          <td>
            <a href="{% url 'patient_detail' p.pk %}">{{ p.hospital_id }}</a>
          </td>
          <td>{{ p.age }}</td>
          <td>{{ p.sex }}</td>
          <td>{{ p.created_at }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4">No patients yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
