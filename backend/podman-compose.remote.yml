version: "3.8"
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: "${REGISTRY_OWNER:-ghcr.io}/${REGISTRY_USER:-${REGISTRY_OWNER}}/oxygen-predictor-api:latest"
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: postop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postop"
    ports:
      - "8000:8000"

  frontend:
    image: "${REGISTRY_OWNER:-ghcr.io}/${REGISTRY_USER:-${REGISTRY_OWNER}}/oxygen-predictor-frontend:latest"
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
