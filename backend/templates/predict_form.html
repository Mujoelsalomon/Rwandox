<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Submit Prediction</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 800px;
        border: 1px solid #e6e6e6;
        padding: 16px;
        border-radius: 6px;
      }
      label {
        display: block;
        margin-top: 8px;
      }
      textarea {
        width: 100%;
        height: 160px;
      }
      input[type="text"],
      select {
        width: 100%;
        padding: 8px;
      }
      button {
        margin-top: 12px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>New Prediction</h2>
      <form method="post" action="/submit-prediction">
        <label
          >Patient ID (optional)
          <input type="text" name="patient_id" placeholder="123" />
        </label>

        <label
          >Model Type
          <select name="model_type">
            <option value="xgboost">xgboost</option>
            <option value="lightgbm">lightgbm</option>
            <option value="sklearn">sklearn</option>
          </select>
        </label>

        <label
          >Model Path (optional)
          <input
            type="text"
            name="model_path"
            placeholder="/path/to/model.joblib"
          />
        </label>

        <label
          >Features (JSON)
          <textarea name="features_text">
{
  "age": 65,
  "bmi": 28,
  "asa": 3
}</textarea
          >
        </label>

        <button type="submit">Run Prediction</button>
      </form>
    </div>
  </body>
</html>
